name: Build Flutter Android & Windows

on:
  push:
    branches:
      - 'release/**'
      - main
      - master
      - g4a4.com
      - add-browser
  pull_request:
    branches:
      - 'release/**'
      - main
  workflow_dispatch:   # اجرای دستی

jobs:
  build:
    runs-on: windows-latest   # برای ساخت ویندوز و اندروید

    steps:
      # Checkout برنچ فعلی
      - name: Checkout code
        uses: actions/checkout@v4

      # نصب JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # دانلود Gradle 8.12-all
      - name: Cache/Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.12

      # نصب Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'     # یا ورژنی که استفاده می‌کنید
          channel: stable

      # دانلود دپندنسی‌ها
      - name: Get dependencies
        run: flutter pub get

      # تولید فایل‌های ترجمه
      - name: Generate localization files
        run: flutter gen-l10n

      # ساخت splash screen
      - name: Generate native splash
        run: dart run flutter_native_splash:create --flutter_native_splash.yaml

      # ساخت آیکون‌های لانچر
      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      # Build APK
      - name: Build APK
        run: flutter build apk --release

      # Build AppBundle
      - name: Build App Bundle
        run: flutter build appbundle --release

      # Build Windows (MSIX)
      - name: Build Windows
        run: flutter build windows --release

      # آپلود APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # آپلود AAB
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # آپلود ویندوز
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: build/windows/x64/runner/Release/

      # ساخت Release در گیت‌هاب (اختیاری)
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/windows/x64/runner/Release/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
